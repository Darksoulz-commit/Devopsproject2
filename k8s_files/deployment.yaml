apiVersion: apps/v1
kind: Deployment

metadata:
  name: zero-app
  labels:
    app: zero-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: zero-app

  template:
    metadata:
      labels:
        app: zero-app

    spec:
      containers:
        - name: zero-container
          image: 050670421700.dkr.ecr.ap-south-1.amazonaws.com/amazon-prime:latest
          ports:
            - containerPort: 3000
              protocol: TCP